# Directories scanned by the Publisher in auto-discovery of auxiliary HTMLs.
# Found HTMLs need to have <meta name="reversa-category" content="..."> to be indexed.

scan_roots:
  - path: "_reversa_sdd/"
    description: "SDD specs and outputs of the Discovery and Migration agents."
  - path: ".reversa/"
    description: "Cross-cutting artifacts of the core."
    exclude:
      - "_reversa_docs/"
      - ".reversa/_config/"
      - ".reversa/context/"

categories:
  - id: review
    label: "Code Reviews"
    description: "Annotated PRs generated by reversa-reviewer and similar."
  - id: design-system
    label: "Design System"
    description: "Living Design System from reversa-design-system."
  - id: diagram
    label: "Diagrams"
    description: "Annotated Flowcharts and additional architectures."

limits:
  max_depth: 6
  timeout_seconds: 10
